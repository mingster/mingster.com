# Custom nginx directives for mingster.com.
#
# Lives on the server at: /home/user-data/www/mingster.com.conf
# Apply with:            sudo /root/mailinabox/tools/web_update
#
# This is the ACTUAL running content, mirrored from the box on 2026-07-25.
# Mail-in-a-Box includes this file inside the generated server block for the
# domain (verified: `nginx -T` shows the include inside the 443 block). MiaB
# owns the proxy_pass, the TLS termination, and the forwarded headers via its
# own template. The actual reverse proxy to 127.0.0.1:3002 is configured in
# /home/user-data/www/custom.yaml, not here.
#
# Do NOT add upstream/map/location blocks here. This snippet is injected into
# an existing server block; an `upstream` is an http-context directive and will
# fail to parse, and a second `location /` would collide with the one MiaB
# generates. If you need to change proxy behaviour, edit custom.yaml or the
# MiaB template, not this file.

# App can take a while on some POST paths (OAuth callbacks, AI menu scan);
# raise timeouts and allow bigger uploads.
proxy_connect_timeout 300s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
client_max_body_size  25m;
